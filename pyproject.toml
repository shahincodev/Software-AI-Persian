[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-ai"
version = "0.7.0"
description = "An intelligent task processing system with browser automation and memory capabilities"
license = "All Rights Reserved"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.9.1",
    "python-dotenv>=1.0.0",
    "playwright>=1.36.0",
    "pyfiglet>=1.0.4",
    "SpeechRecognition>=3.10.0",
    "google-cloud-texttospeech>=2.14.0",
    "gTTS>=2.4.0",
    "pydub>=0.25.1",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pyaudio>=0.2.13",
    "pywin32>=305",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pytest>=7.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
]
